[package]
name = "ak820ctl"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/DarkTiengo/ak820ctl"
description = "Controle do AJAZZ AK820 Pro (firmware original) para Linux e Windows, pelo cabo ou pelo dongle 2.4G"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "wayland", "x11"] }
hidapi = "2"
image = { version = "0.25", default-features = false, features = ["png", "gif", "jpeg"] }
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
serde_json = "1.0.154"

[profile.release]
strip = true
lto = true
